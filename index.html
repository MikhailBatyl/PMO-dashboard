<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMO FIT — Портфель проектов и продуктов</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js для KPI-диаграммы -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Прогресс-бар загрузки -->
  <div id="loader" class="hidden"></div>

  <!-- Сообщение об ошибке -->
  <div id="error-banner" class="hidden"></div>

  <!-- ─── Шапка ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-logo">
      PMO FIT
      <span>Портфель проектов и продуктов</span>
    </div>

    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="calendar"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg> Календарь запуска</button>
      <button class="nav-tab" data-tab="portfolio"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="2" y1="12" x2="22" y2="12"/></svg> Портфель</button>
      <button class="nav-tab" data-tab="gantt"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><rect x="6" y="14" width="7" height="3" rx="1" fill="currentColor" stroke="none"/><rect x="10" y="18" width="7" height="3" rx="1" fill="currentColor" stroke="none" y="18"/></svg> Гантт</button>
      <button class="nav-tab" data-tab="risks"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#e53e3e" stroke="#e53e3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13" stroke="white" stroke-width="2.5"/><circle cx="12" cy="17" r="0.5" fill="white" stroke="white" stroke-width="2"/></svg> Риски</button>
    </nav>

    <button id="btn-refresh" title="Обновить данные">↻ Обновить</button>
  </header>

  <!-- ─── Панель фильтров (видна только на Портфеле и Гантте) ──── -->
  <div id="filters-bar" class="filters-bar hidden">
    <label>Тип:</label>
    <select id="filter-type">
      <option value="">Все типы</option>
      <option value="Проект">Проект</option>
      <option value="Продукт">Продукт</option>
    </select>

    <label>Ответственный:</label>
    <select id="filter-owner">
      <option value="">Все ответственные</option>
    </select>

    <label>Статус:</label>
    <select id="filter-status">
      <option value="">Все статусы</option>
      <option value="🔴">🔴 Критично</option>
      <option value="🟡">🟡 Контроль</option>
      <option value="🟢">🟢 В норме</option>
    </select>
  </div>

  <!-- ─── Основной контент ───────────────────────────────────── -->
  <main class="main-content">

    <!-- Экран: Портфель -->
    <section id="screen-portfolio" class="screen hidden">
      <!-- KPI карточки -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-projects">—</div>
          <div class="kpi-label">Проектов</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-products">—</div>
          <div class="kpi-label">Продуктов</div>
        </div>
        <div class="kpi-card kpi-accent">
          <div class="kpi-value" id="kpi-total">—</div>
          <div class="kpi-label">Всего ценностей</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-value" id="kpi-green">—</div>
          <div class="kpi-label">🟢 В норме</div>
        </div>
        <div class="kpi-card kpi-yellow">
          <div class="kpi-value" id="kpi-yellow">—</div>
          <div class="kpi-label">🟡 Контроль</div>
        </div>
        <div class="kpi-card kpi-red">
          <div class="kpi-value" id="kpi-red">—</div>
          <div class="kpi-label">🔴 Критично</div>
        </div>
      </div>

      <!-- Диаграмма статусов -->
      <div class="dashboard-bottom">
        <div id="portfolio-container">
          <p class="no-data">Загрузка данных…</p>
        </div>
        <div class="chart-card">
          <h3>Распределение статусов</h3>
          <div class="chart-wrapper">
            <canvas id="status-chart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- Экран: Гантт -->
    <section id="screen-gantt" class="screen hidden">
      <div class="gantt-legend">
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-strip-plan"></span> План</span>
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-strip-fact"></span> Факт</span>
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-strip-deviation"></span> Отставание</span>
      </div>
      <div id="gantt-container">
        <p class="no-data">Загрузка данных…</p>
      </div>
    </section>

    <!-- Экран: Риски и отклонения -->
    <section id="screen-risks" class="screen hidden">
      <div id="risks-container">
        <p class="no-data">Загрузка данных…</p>
      </div>
    </section>

    <!-- Экран: Календарь запуска -->
    <section id="screen-calendar" class="screen">
      <!-- Воронка портфеля (верхняя доска) -->
      <div id="funnel-board" class="funnel-board">
        <p class="no-data">Загрузка данных…</p>
      </div>
      <!-- Сетка запусков по месяцам -->
      <div id="cal-grid">
        <p class="no-data">Загрузка данных…</p>
      </div>
    </section>

  </main>

  <!-- Toast-уведомление -->
  <div id="toast" class="toast"></div>

  <!-- Всплывающая подсказка по ценности -->
  <div id="task-tooltip" class="task-tooltip hidden">
    <div class="tooltip-title"></div>
    <div class="tooltip-desc"></div>
    <div class="tooltip-kpi"></div>
  </div>

  <!-- Попап мини-Гантт периода запуска -->
  <div id="period-popup" class="hidden"></div>

  <!-- Скрипты (порядок важен: сначала api.js, потом gantt.js, потом app.js) -->
  <script src="api.js"></script>
  <script src="gantt.js"></script>
  <script src="app.js"></script>

</body>
</html>
